spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 5000
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  ai:
    mcp:
      server:
        name: transaction-service
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp
  graphql:
    graphiql:
      enabled: true
  application:
    name: transaction-service
  cloud:
    config:
      request-connect-timeout: 1000
      request-read-timeout: 1000
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 2000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:h2:file:${bank.data-directory:./data}/transactions;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000;WRITE_DELAY=0
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8082

bank:
  events:
    enabled: ${KAFKA_OUTBOX_ENABLED:true}
    poll-interval-ms: 5000
    initial-delay-ms: 5000
  transaction:
    max-amount: 1000

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

bank-account-circuit:
  sliding-window-size: 10
  minimum-calls: 5
  failure-rate-threshold: 50
  open-duration: 5s
  half-open-calls: 2

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_HOST:127.0.0.1}
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}
    lease-renewal-interval-in-seconds: 5
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 1
    instance-info-replication-interval-seconds: 5
    eureka-server-connect-timeout-seconds: 1
    eureka-server-read-timeout-seconds: 1
