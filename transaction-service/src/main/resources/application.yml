spring:
  application:
    name: transaction-service
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 2000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:h2:file:${bank.data-directory:./data}/transactions;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000;WRITE_DELAY=0
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8082

bank:
  transaction:
    max-amount: 1000

account:
  service:
    url: http://localhost:8081
