spring:
  ai:
    mcp:
      server:
        name: account-service
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp
  graphql:
    graphiql:
      enabled: true
  application:
    name: account-service
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:h2:file:${bank.data-directory:./data}/accounts;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000;WRITE_DELAY=0
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8081
