spring:
  ai:
    mcp:
      server:
        name: account-service
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp
  graphql:
    graphiql:
      enabled: true
  application:
    name: account-service
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:h2:file:${bank.data-directory:./data}/accounts;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000;WRITE_DELAY=0
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_HOST:127.0.0.1}
    instance-id: ${spring.application.name}:${server.port}:${random.uuid}
    lease-renewal-interval-in-seconds: 5
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 1
    instance-info-replication-interval-seconds: 5
    eureka-server-connect-timeout-seconds: 1
    eureka-server-read-timeout-seconds: 1
